name: paired-coding landlock helper

on:
  push:
    branches: [main]
    paths:
      - plugins/paired-coding/landlock/**
      - .github/workflows/paired-coding-landlock.yml
  pull_request:
    paths:
      - plugins/paired-coding/landlock/**
      - .github/workflows/paired-coding-landlock.yml

permissions:
  contents: read

jobs:
  rebuild:
    name: rebuild from source and match SHA256SUMS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/paired-coding/landlock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: committed binaries match the committed SHA256SUMS
        run: sha256sum -c SHA256SUMS
      - name: unit tests
        run: >
          docker run --rm -v "$PWD":/src:ro -e CARGO_TARGET_DIR=/tmp/target -w /src
          rust:1.99.0-bookworm@sha256:114c7a4425406451c2866b6aafe69fe29b1b298832db1277d411ac73c82d04d6
          cargo test --locked
      - name: rebuild both targets in the pinned Rust image
        run: sh build.sh "$RUNNER_TEMP/rebuild"
      - name: the rebuild is byte-identical to the committed binaries
        run: diff SHA256SUMS "$RUNNER_TEMP/rebuild/SHA256SUMS"

  live:
    name: live Landlock tests (${{ matrix.arch }}, non-root)
    needs: rebuild
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: plugins/paired-coding/landlock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: runner kernel and Landlock ABI
        run: |
          uname -srm
          id
          bin/pair-landlock-${{ matrix.arch }}-linux --abi
      - name: live tests on the runner kernel
        run: sh test/live.sh bin/pair-landlock-${{ matrix.arch }}-linux
      - name: live tests in ubuntu:24.04 as uid 1000, and the no-Landlock exit code
        run: sh test/docker.sh ${{ matrix.arch }}
