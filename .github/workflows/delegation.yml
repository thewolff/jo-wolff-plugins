name: delegation

on:
  push:
    paths:
      - "plugins/delegation/**"
      - ".github/workflows/delegation.yml"
      - ".claude-plugin/marketplace.json"
      - ".omp-plugin/marketplace.json"
  pull_request:
    paths:
      - "plugins/delegation/**"
      - ".github/workflows/delegation.yml"
      - ".claude-plugin/marketplace.json"
      - ".omp-plugin/marketplace.json"

permissions:
  contents: read

jobs:
  test:
    name: node --test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: plugins/delegation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Tests
        run: node --test
