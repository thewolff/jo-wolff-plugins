name: coordinator

on:
  push:
    paths:
      - "plugins/coordinator/**"
      - ".github/workflows/coordinator.yml"
  pull_request:
    paths:
      - "plugins/coordinator/**"
      - ".github/workflows/coordinator.yml"

permissions:
  contents: read

jobs:
  test:
    name: node --test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: plugins/coordinator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Tests
        run: node --test
