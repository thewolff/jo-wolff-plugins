name: paired-coding

on:
  push:
    paths:
      - "plugins/paired-coding/**"
      - ".github/workflows/paired-coding.yml"
  pull_request:
    paths:
      - "plugins/paired-coding/**"
      - ".github/workflows/paired-coding.yml"

permissions:
  contents: read

jobs:
  linux:
    name: node --test, bubblewrap and Landlock live (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # A sandbox regression that lets a run's children outlive it hangs rather than fails; the
    # per-test timeout turns a stuck test into a failure, and this caps the job if node itself
    # stays alive. No --test-force-exit: it ends the run with tests still unreported and exit 0.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/paired-coding
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 runners restrict them through AppArmor
        # (https://github.com/actions/runner-images/issues/10443); the image change that would have
        # lifted it (https://github.com/actions/runner-images/pull/11489) was closed unmerged.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: bubblewrap smoke check
        run: bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all /bin/true && echo ok
      - name: Landlock smoke check
        # pair-landlock prints the kernel's Landlock ABI; 1.2 needs 3 or later.
        run: landlock/bin/pair-landlock-$(uname -m)-linux --abi
      - name: Tests, with the live bubblewrap and Landlock cases required to run
        run: node --test --test-timeout=120000
        env:
          PAIRED_CODING_REQUIRE_BWRAP: "1"
          PAIRED_CODING_REQUIRE_LANDLOCK: "1"

  landlock-only:
    # The machine most Ubuntu 24.04 users have: Landlock works, bubblewrap does not (AppArmor
    # restricts unprivileged user namespaces, and bubblewrap may not be installed at all). Every
    # run and write Landlock can express has to work here, and the rest has to be refused.
    name: node --test, Landlock only, bubblewrap unusable (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/paired-coding
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Keep unprivileged user namespaces restricted
        # The image default; set it anyway, so a change of default cannot quietly make bubblewrap
        # usable here.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          fi
      - name: Make sure bubblewrap is unusable
        # The runner image does not list bubblewrap. If it is there and can make its sandbox anyway,
        # remove it. Then the gate's own probe has to report it unusable.
        run: |
          if command -v bwrap && bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all /bin/true; then
            echo "bubblewrap works here; removing it"
            sudo apt-get remove -y bubblewrap
          fi
          node --input-type=module -e '
            const { bwrapProblem } = await import("./lib/bwrap.mjs");
            const problem = bwrapProblem();
            if (problem === null) { console.error("bubblewrap is usable"); process.exit(1); }
            console.log(`bubblewrap unusable: ${problem}`);
          '
      - name: Landlock smoke check
        run: landlock/bin/pair-landlock-$(uname -m)-linux --abi
      - name: Tests, with the live Landlock cases required to run
        run: node --test --test-timeout=120000
        env:
          PAIRED_CODING_REQUIRE_LANDLOCK: "1"

  docker-masked-proc:
    # Docker without --security-opt systempaths=unconfined masks parts of the container's /proc
    # (/proc/kcore, /proc/keys and others), and with those masks in place the kernel refuses
    # bubblewrap a fresh /proc even where user namespaces work. bubblewrap then binds the
    # container's /proc read-only (lib/bwrap.mjs chooseProc), and the live bubblewrap cases,
    # including the ro-bind ones, have to run and pass under it.
    name: node --test in Docker with /proc masked, bubblewrap on its /proc fallback (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Allow unprivileged user namespaces
        # As in the linux job: the runner's AppArmor restricts them, in containers too.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Start Ubuntu 24.04 with seccomp unconfined and Docker's /proc masks left on
        # seccomp=unconfined lets bubblewrap make user namespaces. No systempaths=unconfined: the
        # masks are what this job tests. apparmor=unconfined because Docker's default AppArmor
        # profile denies every mount (https://github.com/moby/profiles, apparmor/template.go),
        # which bubblewrap needs whatever its /proc. The runner's node is mounted in.
        run: |
          docker run -d --name pc --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$(dirname "$(dirname "$(command -v node)")"):/opt/node:ro" \
            ubuntu:24.04 sleep infinity
          docker exec pc sh -c 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bubblewrap ca-certificates git diffutils procps python3'
      - name: A fresh /proc is refused here, and the read-only bind of the container's works
        run: |
          if docker exec -u ubuntu pc bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all /bin/true; then
            echo "a fresh /proc works in this container, so it does not test the fallback"
            exit 1
          fi
          docker exec -u ubuntu pc bwrap --ro-bind / / --dev /dev --ro-bind /proc /proc --unshare-all /bin/true
      - name: Tests, with the live bubblewrap cases required to run under the /proc fallback
        run: |
          docker exec -u ubuntu -w /home/ubuntu \
            -e PATH=/opt/node/bin:/usr/bin:/bin \
            -e PAIRED_CODING_REQUIRE_BWRAP=1 -e PAIRED_CODING_REQUIRE_LANDLOCK=1 -e PAIRED_CODING_REQUIRE_PROC_FALLBACK=1 \
            pc sh -c 'cp -r /src/plugins/paired-coding pc && cd pc && node --test --test-timeout=120000'
