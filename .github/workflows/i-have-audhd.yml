name: i-have-audhd

on:
  push:
    paths:
      - "plugins/i-have-audhd/**"
      - ".github/workflows/i-have-audhd.yml"
  pull_request:
    paths:
      - "plugins/i-have-audhd/**"
      - ".github/workflows/i-have-audhd.yml"

permissions:
  contents: read

jobs:
  test:
    name: node --test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: plugins/i-have-audhd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Tests
        run: node --test
